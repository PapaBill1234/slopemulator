[package]
name = "lobbydaemon"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bloodlib = { path = "../BloodLib" }
packet = { path = "../Packet" }
packet-ids = { path = "../PacketIds" }
shared = { path = "../Shared" }
gamegate = { path = "../../Platform/StServers/GameGate" }
sts = { path = "../../Platform/Sts", features = ["listener", "np-adapter"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }

tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }

[features]
default = []
# SQL Server Store adapter. Connection settings come only from the environment at run time.
mssql = ["dep:tiberius", "dep:tokio-util"]
# Local test pairing: sts-local and lobbyd in one process with one token authority.
sts-local = ["dep:sts"]

[[bin]]
name = "lobbyd-sts"
path = "src/bin/lobbyd-sts.rs"
required-features = ["sts-local"]

[dev-dependencies]
lobbygate = { path = "../LobbyGate" }
sts = { path = "../../Platform/Sts" }
sts-core = { path = "../../Platform/StServers/StsCore" }
routesrv = { path = "../../Platform/StServers/RouteSrv" }
cligate = { path = "../../Platform/StServers/CliGate" }
authsrv = { path = "../../Platform/StServers/AuthSrv" }
gameaccountsrv = { path = "../../Platform/StServers/GameAccountSrv" }
slotsrv = { path = "../../Platform/StServers/SlotSrv" }
play-stubs = { path = "../../Platform/StServers/PlayStubs" }
tokio = { version = "1", features = ["test-util"] }
rand = "0.8"
rsa = "0.9"
num-bigint = "0.4"
